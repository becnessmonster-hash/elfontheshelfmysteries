<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Case Files | Elf Mysteries</title>
  <style>
    :root {
      --red: #a4161a;
      --red-dark: #660708;
      --green: #1b4332;
      --cream: #fdf8ef;
      --ink: #1f1a17;
      --muted: #5c524c;
      --line: #e6dccf;
      --gold: #e9c46a;
      --card: #ffffff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.65;
    }

    /* Header: compact, same colour as the page */
    .site-header {
      max-width: 960px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 4px 16px;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      font-size: 1.35rem;
      font-weight: bold;
      letter-spacing: 0.04em;
      color: var(--red-dark);
      text-decoration: none;
    }

    nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 2px;
    }

    nav a {
      display: block;
      padding: 6px 10px;
      color: var(--ink);
      text-decoration: none;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-bottom: 2px solid transparent;
    }

    nav a:hover { color: var(--red); }
    nav a[aria-current="page"] { color: var(--red); border-bottom-color: var(--red); }

    main {
      max-width: 860px;
      margin: 0 auto;
      padding: 32px 16px 48px;
    }

    .logo {
      display: block;
      width: 100%;
      max-width: 347px;
      margin: 0 auto 28px;
    }

    .intro {
      font-size: 1.1rem;
      text-align: left;
    }

    .motto {
      margin: 36px 0 0;
      font-size: 1.4rem;
      font-style: italic;
      color: var(--green);
    }


    h1 {
      color: var(--red-dark);
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      line-height: 1.25;
      margin: 0 0 20px;
    }

    a { color: var(--red); }

    form { display: grid; gap: 14px; }

    label {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.9rem;
    }

    input {
      font: inherit;
      padding: 10px 12px;
      border: 1px solid #c9bfb6;
      border-radius: 4px;
      background: #fff;
    }
