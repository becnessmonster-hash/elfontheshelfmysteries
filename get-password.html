    :root {

      --muted: #5c524c;
      --line: #e6dccf;
    }

    * { box-sizing: border-box; }

    body {

    }

    .site-header {

      margin: 0 auto;

      display: flex;

      gap: 2px;

      padding: 6px 10px;
      color: var(--ink);

      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      border-bottom: 2px solid transparent;
    }

    nav a:hover { color: var(--red); }
    nav a[aria-current="page"] { color: var(--red); border-bottom-color: var(--red); }

      font-size: 1.4rem;
      font-style: italic;
      color: var(--green);
    }


    h1 {
      color: var(--red-dark);
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      line-height: 1.25;
      margin: 0 0 20px;
    }

    .back {
      display: inline-block;
      margin-bottom: 16px;
      color: var(--red);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.85rem;

      background: #fff;

      border-radius: 4px;

      padding: 20px 24px;
      margin-top: 28px;
    }

    .riddle h2 { color: var(--red-dark); margin: 0 0 12px; }

    .clues { padding-left: 1.4em; margin-bottom: 0; }
    .clues li { margin-bottom: 10px; }

    .hint {
      background: var(--green);
      color: #fff;
      padding: 18px 22px;
      border-radius: 4px;
      margin-top: 28px;
    }

    .hint p { margin: 0; }
    .hint a { color: #e9c46a; }

    /* Footer: compact, same colour as the page */
    footer {
      max-width: 960px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.78rem;
    }
